name: PFA Karate API Tests

on:
  push:
    branches: [ main, karatedev ]
  pull_request:
    branches: [ main, karatedev ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options: [ dev, qa, staging ]

jobs:
  karate-api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Java and Maven versions
        run: |
          java -version
          mvn -version

      - name: Run Karate API tests
        env:
          API_EMAIL: ${{ secrets.API_EMAIL }}
          API_PASSWORD: ${{ secrets.API_PASSWORD }}
          DEVICE_ID: ${{ secrets.DEVICE_ID }}
        run: |
          mvn clean test -B -ntp \
            -Dkarate.env=${{ github.event.inputs.environment || 'dev' }} \
            -Demail="$API_EMAIL" \
            -Dpassword="$API_PASSWORD" \
            -DdeviceId="$DEVICE_ID"

      - name: Upload Karate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karate-api-report
          path: target/karate-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-report
          path: target/surefire-reports/
          if-no-files-found: error
          retention-days: 14